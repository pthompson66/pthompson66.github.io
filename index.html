<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#5d4c78">
    <title>Pax's Website</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #5d4c78;
      }

      * {
        box-sizing: border-box;
      }
    
      body {
        min-height: 50vh;
        min-width: 10vh;
        margin: 0;
        display: grid;
        place-items: right;
        padding: 3rem;
      }

      main {
        width: min(50%, 42rem);
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid #e1e6ef;
        border-radius: 1.5rem;
        background: #fff;
        box-shadow: 0 1.5rem 4rem rgb(28 43 70 / 8%);
      }

      p {
        margin: 0 0 0.75rem;
        color: #52617a;
        line-height: 1.6;
      }

      .eyebrow {
        color: #5268d8;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        letter-spacing: -0.06em;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Your website starts here</p>
      <h1>Hello, world.</h1>
      <p>asdfasdfasdf</p>
    </main>
  </body>
</html>
